name: Build wheels

on:
  push:
    branches: ['geotrellis_3.5']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel
        run: |
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist
      - name: Create release with wheels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ github.ref_name }}-${{ github.run_number }}
          TITLE: Build ${{ github.ref_name }} #${{ github.run_number }}
          TARGET: ${{ github.sha }}
        run: |
          # Tag is unique per branch and commit; release targets the current commit
          gh release create "$TAG" dist/*.whl --target "$TARGET" --title "$TITLE" --prerelease --notes ""

