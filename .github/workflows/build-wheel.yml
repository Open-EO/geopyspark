name: Build wheels

on:
  push:
    branches: ['geotrellis_3.5']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          TAG="py$(echo '${{ matrix.python-version }}' | tr -d .)"
          python setup.py bdist_wheel --python-tag "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}
          path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Create release with wheels
        uses: softprops/action-gh-release@v2
        with:
          # Tag is unique per branch and commit; release targets the current commit
          tag_name: build-${{ github.ref_name }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.ref_name }} #${{ github.run_number }}
          prerelease: true
          files: dist/*.whl

